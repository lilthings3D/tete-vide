<style>
  :root{
    --bg:#15111b; --bg2:#1f1826; --panel:#271f30; --panel2:#322740;
    --ink:#f3ebe0; --ink-soft:#b6a9bd; --line:#4a3d57;
    --red:#d64545; --red-deep:#b23232; --rage:#e8663a;
    --gold:#e8c06a; --green:#6fbf73; --intel:#9b7fe0;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  [hidden]{display:none!important;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:var(--safe-t) 0 var(--safe-b);}
  .serif{font-family:'Newsreader',Georgia,serif;}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}

  .topbar{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;}
  .topbar a{color:var(--ink-soft);text-decoration:none;font-size:0.82rem;}
  .topbar .ttl{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:1rem;letter-spacing:.5px;}
  .topbar .ttl b{color:var(--rage);}

  #frame{width:100%;max-width:520px;flex:1;display:flex;flex-direction:column;position:relative;min-height:0;}
  #hud{padding:5px 12px 3px;}
  .bars{display:flex;gap:8px;margin-bottom:4px;}
  .bar{flex:1;}
  .bar .lab{display:flex;justify-content:space-between;font-size:0.66rem;color:var(--ink-soft);margin-bottom:2px;}
  .bar .track{height:8px;background:var(--panel);border-radius:5px;overflow:hidden;}
  .bar .fill{height:100%;transition:width .25s;}
  .fill.pv{background:linear-gradient(90deg,var(--red-deep),var(--red));}
  .fill.rage{background:linear-gradient(90deg,#c23,var(--rage));}
  .stats{display:flex;gap:10px;flex-wrap:wrap;font-size:0.74rem;color:var(--ink-soft);}
  .stats b{color:var(--ink);} .stats .deg b{color:var(--rage);}

  #stage{flex:1;position:relative;min-height:0;margin:3px 10px 8px;border-radius:12px;overflow:hidden;background:#0b0810;box-shadow:0 8px 30px rgba(0,0,0,.5);touch-action:none;}
  #stage canvas{width:100%!important;height:100%!important;display:block;}
  #crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:rgba(255,255,255,.35);z-index:3;pointer-events:none;}

  #joy{position:absolute;left:14px;bottom:14px;width:104px;height:104px;border-radius:50%;background:rgba(40,30,55,.42);border:1.5px solid rgba(120,100,150,.4);touch-action:none;z-index:5;}
  #joy-knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(232,102,58,.85);box-shadow:0 2px 8px rgba(0,0,0,.4);}
  #joy-hint{position:absolute;left:0;right:0;bottom:-17px;text-align:center;font-size:0.6rem;color:var(--ink-soft);}
  .fps-act{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;}
  .fps-act .a-btn{width:80px;height:80px;border-radius:50%;background:rgba(232,102,58,.92);color:#fff;font-weight:700;font-size:0.9rem;box-shadow:0 3px 10px rgba(0,0,0,.4);}
  .fps-act .a-btn:active{transform:scale(.94);}
  .fps-act .mini{display:flex;gap:7px;}
  .fps-act .mini button{width:50px;height:38px;border-radius:10px;background:rgba(50,39,64,.9);border:1px solid var(--line);font-size:0.68rem;color:var(--ink-soft);font-weight:600;}
  #prompt{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);background:rgba(20,15,26,.92);border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:0.82rem;z-index:5;white-space:nowrap;}
  #look-hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:0.68rem;color:rgba(182,169,189,.7);z-index:4;text-align:center;}

  /* ===== CINÉMATIQUE ===== */
  #cine{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
  #cine .bar-top,#cine .bar-bot{position:absolute;left:0;right:0;height:9%;background:#000;z-index:3;}
  #cine .bar-top{top:0;} #cine .bar-bot{bottom:0;}
  #cine-scene{position:absolute;inset:0;transition:background 1.2s ease;display:flex;align-items:center;justify-content:center;}
  #cine-emoji{font-size:28vmin;line-height:1;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));}
  #cine-cap{position:absolute;bottom:14%;left:0;right:0;text-align:center;padding:0 24px;font-family:'Newsreader',Georgia,serif;font-size:clamp(1.1rem,4.4vw,1.7rem);color:#f3ebe0;text-shadow:0 2px 12px #000;}
  #cine-skip{position:absolute;bottom:11%;right:18px;z-index:5;color:rgba(243,235,224,.7);font-size:0.82rem;border:1px solid rgba(243,235,224,.3);padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.3);}
  @keyframes cine-in{0%{opacity:0;transform:scale(.86)}18%{opacity:1}100%{opacity:1;transform:scale(1.14)}}
  @keyframes cap-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  #cine-flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:4;pointer-events:none;}

  .ov{position:fixed;inset:0;z-index:50;background:rgba(10,7,14,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;}
  .card{width:100%;max-width:420px;background:var(--bg2);border:1.5px solid var(--line);border-radius:18px;padding:22px;max-height:90vh;overflow-y:auto;}
  .card h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:1.5rem;margin-bottom:8px;line-height:1.1;}
  .card h2 b{color:var(--rage);}
  .card p{color:var(--ink-soft);font-size:0.94rem;line-height:1.55;margin-bottom:12px;}
  .card p em{color:var(--ink);font-style:italic;}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;font-weight:600;font-size:0.98rem;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);}
  .btn:hover{border-color:var(--rage);}
  .btn.primary{background:var(--rage);color:#fff;border-color:var(--rage);}
  .btn.ghost{background:none;color:var(--ink-soft);border-color:transparent;font-size:0.84rem;padding:8px;}
  .big-emoji{font-size:3rem;text-align:center;margin-bottom:6px;}

  #combat .card{max-width:430px;}
  .enemy-zone{text-align:center;margin-bottom:10px;}
  .enemy-emoji{font-size:3.4rem;line-height:1;}
  .enemy-emoji.hit{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .enemy-name{font-family:'Newsreader',Georgia,serif;font-size:1.15rem;font-weight:600;margin-top:4px;}
  .enemy-tag{font-size:0.72rem;color:var(--ink-soft);}
  .ehp{height:11px;background:var(--panel);border-radius:6px;overflow:hidden;margin:8px auto 0;max-width:260px;}
  .ehp .fill{height:100%;background:linear-gradient(90deg,#8a2,#6fbf73);transition:width .3s;}
  .log{min-height:44px;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:0.88rem;line-height:1.4;margin:12px 0;color:var(--ink);}
  .pstat{display:flex;gap:8px;margin-bottom:10px;}
  .pstat .b{flex:1;}
  .pstat .lab{font-size:0.66rem;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .pstat .track{height:8px;background:var(--panel);border-radius:5px;overflow:hidden;margin-top:2px;}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .move{padding:12px 10px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);text-align:left;}
  .move:hover:not(:disabled){border-color:var(--rage);}
  .move:disabled{opacity:.4;}
  .move .mn{font-weight:700;font-size:0.92rem;display:block;}
  .move .md{font-size:0.7rem;color:var(--ink-soft);}

  .skill{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--panel);}
  .skill .se{font-size:1.6rem;} .skill .si{flex:1;}
  .skill .sn{font-weight:700;font-size:0.92rem;} .skill .sd{font-size:0.74rem;color:var(--ink-soft);}
  .skill button{padding:9px 12px;border-radius:9px;background:var(--rage);color:#fff;font-weight:700;font-size:0.8rem;white-space:nowrap;}
  .skill button:disabled{background:var(--panel2);color:var(--ink-soft);}
  .skill.owned{opacity:.6;}
  .pts{text-align:center;font-size:0.9rem;color:var(--gold);margin-bottom:12px;}

  .toast{position:fixed;left:50%;top:calc(10px + var(--safe-t));transform:translateX(-50%) translateY(-16px);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:0.84rem;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:92%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  #loading{position:fixed;inset:0;z-index:70;background:#0b0810;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-family:'Newsreader',Georgia,serif;}
</style>

<script>
"use strict";
const SAVE="rage-de-dent-3d1";
const $=id=>document.getElementById(id);
const COLS=13, ROWS=14, WALLH=3.0;
const MAP=[
 "#############","#...........#","#...........#","#....###....#",
 "#....#.#....#","#......#....#","#...........#","#...........#",
 "#....###....#","#...........#","#...........#","#...........#",
 "#####...#####","######.######",
].map(r=>r.split(""));
function wall(x,y){ x=Math.floor(x);y=Math.floor(y); return !MAP[y]||!MAP[y][x]||MAP[y][x]==="#"; }

const BEST={
 mamie:{nom:"Mamie en déambulateur",emoji:"👵",pv:14,force:4,xp:4,deg:10,fort:false,cri:"« POUSSEZ-VOUS, bon sang ! »"},
 perf:{nom:"Patient sous perfusion",emoji:"🤕",pv:12,force:3,xp:4,deg:8,fort:false,cri:"Il traîne sa potence à roulettes vers toi."},
 aide:{nom:"Aide-soignant",emoji:"🧑‍⚕️",pv:22,force:6,xp:9,deg:16,fort:true,cri:"« Monsieur, vous DEVEZ vous recoucher. »"},
 infirmier:{nom:"Infirmier costaud",emoji:"💪",pv:30,force:8,xp:13,deg:22,fort:true,cri:"Il craque ses doigts un par un."},
 medecin:{nom:"Le Médecin",emoji:"👨‍⚕️",pv:58,force:10,xp:30,deg:60,fort:true,boss:true,cri:"« On va vous garder… pour des examens. »"},
};

let P, ENT, scr="cine";
function freshGame(){
  P={ px:2.5,pz:2.5,yaw:Math.PI,pitch:0, niv:1,xp:0,xpNext:12, pvMax:30,pv:30, force:5,intel:1,
      rage:0,rageMax:100, deg:0, pts:0, skills:{}, bossDown:false, sortCd:0 };
  ENT=[
    {t:"enemy",k:"mamie",x:6,y:2,alive:true},
    {t:"enemy",k:"perf",x:3,y:6,alive:true},
    {t:"enemy",k:"aide",x:9,y:7,alive:true},
    {t:"enemy",k:"infirmier",x:6,y:9,alive:true},
    {t:"enemy",k:"medecin",x:6,y:11,alive:true},
    {t:"book",x:10,y:2,used:false,emoji:"📖",titre:"« Vaincre sa colère en 7 étapes »",gain:3},
    {t:"book",x:2,y:10,used:false,emoji:"📕",titre:"« Le grand livre des insultes fleuries »",gain:3},
    {t:"smash",x:10,y:10,broken:false,emoji:"🥤",nom:"Distributeur de boissons",force:6,deg:40,soin:10},
    {t:"smash",x:2,y:4,broken:false,emoji:"🧺",nom:"Chariot de linge sale",force:4,deg:18,soin:0},
    {t:"exit",x:6,y:13,emoji:"🚪"},
  ];
}
function alive(e){
  if(e.t==="enemy") return e.alive;
  if(e.t==="book") return !e.used;
  if(e.t==="smash") return !e.broken;
  return true;
}
function emOf(e){ return e.t==="enemy"?BEST[e.k].emoji:e.emoji; }
function save(){ try{ localStorage.setItem(SAVE,JSON.stringify({P,ENT,scr})); }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem(SAVE)); if(d&&d.P){P=d.P;ENT=d.ENT;return true;} }catch(e){} return false; }

/* ===================== MONDE 3D (Three.js) ===================== */
let renderer, scene, camera, torch, raf=0;
const texCache={};
function emojiTexture(em){
  if(texCache[em]) return texCache[em];
  const c=document.createElement("canvas"); c.width=c.height=128;
  const g=c.getContext("2d"); g.clearRect(0,0,128,128);
  g.textAlign="center"; g.textBaseline="middle"; g.font="100px serif";
  g.fillText(em,64,72);
  const t=new THREE.CanvasTexture(c); t.anisotropy=1; texCache[em]=t; return t;
}
function buildWorld(){
  const stage=$("stage");
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(1.6,window.devicePixelRatio||1));
  renderer.setClearColor(0x0a0812,1);
  stage.insertBefore(renderer.domElement, stage.firstChild);

  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x0a0812, 0.14);
  camera=new THREE.PerspectiveCamera(72, 1, 0.05, 60);
  camera.rotation.order="YXZ";

  // lumières
  scene.add(new THREE.AmbientLight(0x48506b, 0.75));
  const hemi=new THREE.HemisphereLight(0x8fa0c0, 0x1a2018, 0.5); scene.add(hemi);
  torch=new THREE.PointLight(0xffe6c0, 0.9, 10, 2); scene.add(torch);

  // sol (lino verdâtre) + plafond
  const floorMat=new THREE.MeshLambertMaterial({color:0x2c4336});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(COLS,ROWS), floorMat);
  floor.rotation.x=-Math.PI/2; floor.position.set(COLS/2,0,ROWS/2); scene.add(floor);
  const ceilMat=new THREE.MeshLambertMaterial({color:0x16121f});
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(COLS,ROWS), ceilMat);
  ceil.rotation.x=Math.PI/2; ceil.position.set(COLS/2,WALLH,ROWS/2); scene.add(ceil);

  // murs (InstancedMesh)
  let n=0; for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++) if(MAP[y][x]==="#") n++;
  const wgeo=new THREE.BoxGeometry(1,WALLH,1);
  const wmat=new THREE.MeshLambertMaterial({color:0x6e7d92});
  const inst=new THREE.InstancedMesh(wgeo,wmat,n);
  const dummy=new THREE.Object3D(); let i=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++) if(MAP[y][x]==="#"){
    dummy.position.set(x+0.5,WALLH/2,y+0.5); dummy.updateMatrix(); inst.setMatrixAt(i++,dummy.matrix);
  }
  scene.add(inst);

  // éléments (billboards)
  for(const e of ENT){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTexture(emOf(e)),transparent:true,depthWrite:false}));
    const boss=e.t==="enemy"&&BEST[e.k].boss;
    const sc=boss?1.9:(e.t==="enemy"?1.45:1.1);
    sp.scale.set(sc,sc,sc);
    sp.position.set(e.x+0.5, e.t==="enemy"?0.95:0.7, e.y+0.5);
    sp.visible=alive(e);
    e._sp=sp; scene.add(sp);
  }
  fitRenderer();
}
function fitRenderer(){
  if(!renderer) return;
  const r=$("stage").getBoundingClientRect();
  const w=Math.max(200,Math.round(r.width)), h=Math.max(200,Math.round(r.height));
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener("resize",fitRenderer);
function syncSprites(){ for(const e of ENT){ if(e._sp) e._sp.visible=alive(e); } }
function render3D(){
  camera.rotation.y=P.yaw; camera.rotation.x=P.pitch;
  camera.position.set(P.px,1.55,P.pz);
  torch.position.set(P.px,1.7,P.pz);
  renderer.render(scene,camera);
}

/* ===================== DÉPLACEMENT ===================== */
const keys={}; let joyF=0,joyS=0;
const SPEED=2.7, TURN=2.3;
function canStand(x,z){ const r=0.26; return !wall(x-r,z)&&!wall(x+r,z)&&!wall(x,z-r)&&!wall(x,z+r); }
function update(dt){
  let f=joyF,s=joyS,t=0;
  if(keys["w"]||keys["z"]) f+=1; if(keys["s"]) f-=1;
  if(keys["a"]||keys["q"]) s-=1; if(keys["d"]) s+=1;
  if(keys["arrowleft"]) t+=1; if(keys["arrowright"]) t-=1;
  if(keys["arrowup"]) f+=1; if(keys["arrowdown"]) f-=1;
  f=Math.max(-1,Math.min(1,f)); s=Math.max(-1,Math.min(1,s));
  if(t) P.yaw+=t*TURN*dt;
  if(f||s){
    // forward sur le plan XZ selon yaw (caméra regarde -Z à yaw=0)
    const fx=-Math.sin(P.yaw), fz=-Math.cos(P.yaw);
    const rx=Math.cos(P.yaw), rz=-Math.sin(P.yaw);
    const sp=SPEED*dt;
    const nx=P.px+(fx*f+rx*s)*sp, nz=P.pz+(fz*f+rz*s)*sp;
    if(canStand(nx,P.pz)) P.px=nx;
    if(canStand(P.px,nz)) P.pz=nz;
    if(Math.random()<0.004) toast("🦷 Ta dent t'élance un coup…");
  }
  // rencontre / interaction
  const foe=nearest(["enemy"],0.8);
  if(foe){ startCombat(foe); return; }
  const it=nearest(["book","smash","exit"],1.25);
  const pr=$("prompt");
  if(it){ pr.hidden=false;
    pr.textContent = it.t==="book"?"Action : lire "+it.emoji : it.t==="smash"?"Action : défoncer "+it.emoji : "Action : franchir la porte 🚪";
    P._near=it;
  } else { pr.hidden=true; P._near=null; }
}
function nearest(types,maxd){
  let best=null,bd=maxd*maxd;
  for(const e of ENT){ if(!alive(e))continue; if(!types.includes(e.t))continue;
    const dx=(e.x+0.5)-P.px, dz=(e.y+0.5)-P.pz, d=dx*dx+dz*dz; if(d<bd){bd=d;best=e;} }
  return best;
}
function doAction(){
  if(scr!=="play") return;
  const e=P._near; if(!e){ toast("Rien à portée."); return; }
  if(e.t==="book") readBook(e); else if(e.t==="smash") smash(e); else if(e.t==="exit") tryExit();
}
let last=0,acc=0;
function loop(ts){
  raf=requestAnimationFrame(loop);
  const dt=Math.min(0.05,((ts-last)||16)/1000); last=ts;
  if(scr==="play"){ update(dt); if(scr==="play"){ render3D(); acc+=dt; if(acc>2){acc=0;save();} } }
}

/* ===================== OBJETS ===================== */
function readBook(b){
  b.used=true; syncSprites();
  let g=b.gain+(P.skills.lecture?Math.ceil(b.gain*0.5):0);
  P.intel+=g; hud(); save(); $("prompt").hidden=true; P._near=null;
  showScreen(`<div class="big-emoji">${b.emoji}</div><h2>Tu lis ${b.titre}</h2>
    <p>Tu ne comprends pas tout, mais quelque chose infuse. <em>+${g} Intelligence.</em></p>
    <p style="color:var(--intel)">💡 Transforme ton Intelligence en Force pure avec 🔮 <b>Magie</b>. Plus tu lis, plus tu cognes, plus tu casses.</p>
    <div class="choices"><button class="btn primary" onclick="closeScreen()">OK</button></div>`);
}
function smash(o){
  if(P.force<o.force){ toast("💪 Trop costaud (Force "+o.force+" requise). Lis, muscle-toi."); return; }
  o.broken=true; syncSprites(); P.deg+=o.deg; if(o.soin) P.pv=Math.min(P.pvMax,P.pv+o.soin);
  hud(); save(); $("prompt").hidden=true; P._near=null;
  toast("💥 "+o.nom+" explosé ! +"+o.deg+" dégâts"+(o.soin?" · +"+o.soin+" PV":""));
}
function tryExit(){ if(!P.bossDown){ toast("🚪 Le Médecin te barre la route."); return; } endSlice(); }
function transmute(){
  if(scr!=="play") return;
  if(P.intel<3){ toast("🧠 Pas assez d'Intelligence (il en faut 3). Lis un bouquin."); return; }
  P.intel-=3; P.force+=2; hud(); save(); toast("🔮 3 🧠 → +2 💪 Force. Tu sens tes bras gonfler.");
}

/* ===================== COMBAT ===================== */
let C=null;
function startCombat(e){
  scr="combat"; joyF=joyS=0; $("joy-knob").style.transform="";
  const b=BEST[e.k];
  C={ ref:e, k:e.k, nom:b.nom, emoji:b.emoji, fort:b.fort, boss:!!b.boss, pvMax:b.pv, pv:b.pv, force:b.force, xp:b.xp, deg:b.deg, buff:0, turn:0 };
  if(P.skills.sangchaud) P.rage=Math.min(P.rageMax,P.rage+25);
  $("c-emoji").textContent=b.emoji; $("c-name").textContent=b.nom;
  $("c-tag").textContent=(b.boss?"BOSS · ":"")+(b.fort?"Ennemi coriace":"Ennemi faible");
  log(b.cri); $("prompt").hidden=true; $("combat").hidden=false; renderCombat();
}
function log(t){ $("c-log").innerHTML=t; }
function renderCombat(){
  $("c-hp").style.width=Math.max(0,C.pv/C.pvMax*100)+"%";
  $("c-pv").style.width=Math.max(0,P.pv/P.pvMax*100)+"%"; $("c-pv-txt").textContent=Math.max(0,P.pv)+"/"+P.pvMax;
  $("c-rage").style.width=(P.rage/P.rageMax*100)+"%"; $("c-rage-txt").textContent=Math.round(P.rage);
  const moves=[
    {id:"patate",n:"👊 Patate",d:"Force + rage"},
    {id:"insulte",n:"🗯️ Insulte sismique",d:"40 rage · gros dégâts",dis:P.rage<40},
    {id:"regard",n:"👁️ Regard noir",d:C.fort?"risqué sur les forts":"fait fuir les faibles"},
    {id:"sort",n:"✨ Sort (Intelligence)",d:P.sortCd?"recharge…":"dégâts = 🧠×3",dis:!!P.sortCd},
    {id:"fuir",n:"🏃 Fuir",d:C.boss?"impossible":"tenter de s'enfuir",dis:C.boss},
  ];
  $("c-moves").innerHTML=moves.map(m=>`<button class="move" data-m="${m.id}" ${m.dis?"disabled":""}><span class="mn">${m.n}</span><span class="md">${m.d}</span></button>`).join("");
  $("c-moves").querySelectorAll(".move").forEach(b=>b.onclick=()=>playerMove(b.dataset.m));
}
function rnd(n){ return Math.floor(Math.random()*n); }
function hitAnim(){ const el=$("c-emoji"); el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); }
function disableMoves(){ $("c-moves").querySelectorAll(".move").forEach(b=>b.disabled=true); }
function playerMove(m){
  if(scr!=="combat") return;
  if(Math.random()<0.1){ log("🦷 Ta rage de dent t'élance ! Tu te masses la mâchoire et perds ton tour…"); disableMoves(); setTimeout(enemyTurn,900); return; }
  let dmg=0,txt="";
  if(m==="patate"){ dmg=P.force+rnd(4); P.rage=Math.min(P.rageMax,P.rage+15); txt="👊 Grosse patate. "+dmg+" dégâts."; }
  else if(m==="insulte"){ P.rage-=40; dmg=Math.round(P.force*2.2)+rnd(5)+(P.skills.sangchaud?6:0); txt="🗯️ Une insulte si forte que l'air tremble ! "+dmg+" dégâts."; }
  else if(m==="regard"){ const fortE=C.fort && !(P.skills.sangfroid && C.k==="aide");
    if(!fortE){ log("👁️ Ton regard noir le glace. Il s'enfuit en couinant."); endCombat(false,true); return; }
    C.buff+=3; P.rage=Math.min(P.rageMax,P.rage+25); txt="👁️ Tu le fixes… ça le rend FURIEUX (+force), mais tu encaisses (+rage)."; }
  else if(m==="sort"){ dmg=P.intel*3+rnd(3); P.sortCd=2; txt="✨ Tu transmutes ta pensée en déflagration. "+dmg+" dégâts."; }
  else if(m==="fuir"){ if(Math.random()<0.55){ log("🏃 Tu détales dans le couloir !"); endCombat(false,true); return; } txt="🏃 Raté ! Il te rattrape."; }
  if(dmg>0){ hitAnim(); C.pv-=dmg; }
  log(txt); renderCombat(); disableMoves();
  if(C.pv<=0){ setTimeout(()=>endCombat(true),650); return; }
  setTimeout(enemyTurn,750);
}
function enemyTurn(){
  if(scr!=="combat") return;
  if(P.sortCd) P.sortCd--;
  let txt="", dmg=C.force+C.buff+rnd(3);
  if(C.boss){ C.turn++; if(C.turn%3===0){ P.rage=Math.max(0,P.rage-20); txt="📋 Le Médecin te tend une ordonnance : « du calme ». Rage −20."; dmg=Math.round(dmg*0.6); } }
  const def=(P.skills.sangfroid?2:0); dmg=Math.max(1,dmg-def); P.pv-=dmg;
  log((txt?txt+" ":"")+C.emoji+" riposte : −"+dmg+" PV."); renderCombat();
  if(P.pv<=0){ setTimeout(gameOver,700); return; }
}
function endCombat(win,fled){
  const e=C.ref; $("combat").hidden=true; scr="play"; P.sortCd=0;
  if(win){ e.alive=false; P.deg+=C.deg; gainXp(C.xp);
    if(C.boss){ P.bossDown=true; } else { toast("✅ "+C.nom+" à terre ! +"+C.xp+" XP · +"+C.deg+" dégâts"); }
    if(C.boss){ setTimeout(bossBeaten,450); } }
  else if(fled){ e.alive=false; toast("L'ennemi a dégagé. (pas d'XP)"); }
  syncSprites(); hud(); save(); last=performance.now();
}
function gainXp(n){
  P.xp+=n;
  while(P.xp>=P.xpNext){ P.xp-=P.xpNext; P.niv++; P.xpNext=Math.round(P.xpNext*1.5);
    P.pvMax+=6; P.pv=P.pvMax; P.force+=1; P.pts+=1; if(P.niv%2===0) P.intel+=1;
    toast("⭐ Niveau "+P.niv+" ! +6 PV, +1 Force, +1 point"); }
}

const SKILLS=[
  {id:"grosbras",e:"💪",n:"Gros bras",d:"+3 Force tout de suite."},
  {id:"lecture",e:"🧠",n:"Lecture rapide",d:"Les livres rapportent +50% d'Intelligence. (+2 maintenant)"},
  {id:"sangchaud",e:"🔥",n:"Sang chaud",d:"Insulte plus forte. Tu démarres chaque combat avec +25 rage."},
  {id:"sangfroid",e:"🧊",n:"Sang-froid",d:"+10 PV, −2 dégâts subis, Regard noir fait aussi fuir les aides-soignants."},
];
function openSkills(){
  $("sk-pts").textContent="★ "+P.pts+" point"+(P.pts>1?"s":"")+" à dépenser";
  $("sk-list").innerHTML=SKILLS.map(s=>{ const o=!!P.skills[s.id];
    return `<div class="skill ${o?"owned":""}"><div class="se">${s.e}</div><div class="si"><div class="sn">${s.n}</div><div class="sd">${s.d}</div></div><button data-s="${s.id}" ${o||P.pts<=0?"disabled":""}>${o?"Acquis":"1 ★"}</button></div>`; }).join("");
  $("sk-list").querySelectorAll("button[data-s]").forEach(b=>b.onclick=()=>buySkill(b.dataset.s));

function buySkill(id){
  if(P.skills[id]||P.pts<=0) return;
  P.pts--; P.skills[id]=true;
  if(id==="grosbras") P.force+=3; if(id==="lecture") P.intel+=2;
  if(id==="sangfroid"){ P.pvMax+=10; P.pv+=10; }
  hud(); save(); openSkills();
}

 {bg:"#201a16", em:"🐕💩", cap:"Le chien a encore crotté au milieu du salon.", dur:2800},

 {bg:"#000000", em:"⚫", cap:"Tout devient noir.", dur:2200},
];
let cineT=0;
function runCine(){
  $("cine").hidden=false; let i=0;
  const sc=$("cine-scene"), em=$("cine-emoji"), cap=$("cine-cap");
  function show(){
    if(i>=CINE.length){ endCine(); return; }
    const s=CINE[i];
    sc.style.background=s.bg; em.textContent=s.em; cap.textContent=s.cap;
    em.style.animation="none"; void em.offsetWidth; em.style.animation=`cine-in ${(s.dur)/1000}s ease forwards`;
    cap.style.animation="none"; void cap.offsetWidth; cap.style.animation="cap-in .8s ease forwards";
    if(s.flash){ const fl=$("cine-flash"); fl.style.transition="none"; fl.style.opacity="0"; setTimeout(()=>{ fl.style.transition="opacity .5s"; fl.style.opacity=".8"; setTimeout(()=>fl.style.opacity="0",120); }, s.dur-500); }
    i++; clearTimeout(cineT); cineT=setTimeout(show, s.dur);
  }
  show();
}
function endCine(){ clearTimeout(cineT); $("cine").hidden=true; wakeUp(); }
$("cine-skip").onclick=endCine;

function beginGame(){

  else { rebuildSprites(); afterBuild(); }

function rebuildSprites(){
  for(const e of ENT){ if(e._sp){ scene.remove(e._sp); } }
  for(const e of ENT){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTexture(emOf(e)),transparent:true,depthWrite:false}));
    const boss=e.t==="enemy"&&BEST[e.k].boss; const scl=boss?1.9:(e.t==="enemy"?1.45:1.1);
    sp.scale.set(scl,scl,scl); sp.position.set(e.x+0.5, e.t==="enemy"?0.95:0.7, e.y+0.5); sp.visible=alive(e);
    e._sp=sp; scene.add(sp);
  }
}

/* ===================== ENTRÉES ===================== */
addEventListener("keydown",e=>{ const k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d","z","q"," "].includes(k)) e.preventDefault();
  keys[k]=true; if(k===" "||k==="enter") doAction(); });
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });

function stageEl(){ return $("stage"); }
document.addEventListener("click",e=>{ if(scr==="play" && e.target.closest("#stage") && !e.target.closest("#joy") && !e.target.closest(".fps-act") && !("ontouchstart"in window)){ const c=renderer&&renderer.domElement; if(c&&c.requestPointerLock) c.requestPointerLock(); } });
addEventListener("mousemove",e=>{ if(renderer && document.pointerLockElement===renderer.domElement && scr==="play"){ P.yaw-=e.movementX*0.0026; P.pitch=Math.max(-1.2,Math.min(1.2,P.pitch-e.movementY*0.0026)); } });

const joy=$("joy"),knob=$("joy-knob"); let joyId=null,jcx=0,jcy=0;
joy.addEventListener("touchstart",e=>{ const t=e.changedTouches[0]; joyId=t.identifier; const r=joy.getBoundingClientRect(); jcx=r.left+r.width/2; jcy=r.top+r.height/2; e.preventDefault(); },{passive:false});
joy.addEventListener("touchmove",e=>{ for(const t of e.changedTouches){ if(t.identifier!==joyId)continue; let dx=t.clientX-jcx,dy=t.clientY-jcy; const R=44,d=Math.hypot(dx,dy); if(d>R){dx=dx/d*R;dy=dy/d*R;} knob.style.transform=`translate(${dx}px,${dy}px)`; joyS=dx/R; joyF=-dy/R; } e.preventDefault(); },{passive:false});
function joyEnd(e){ for(const t of e.changedTouches){ if(t.identifier===joyId){ joyId=null; joyF=joyS=0; knob.style.transform=""; } } }
joy.addEventListener("touchend",joyEnd); joy.addEventListener("touchcancel",joyEnd);

const stage=$("stage"); let lookId=null,lx=0,ly=0;
stage.addEventListener("touchstart",e=>{ for(const t of e.changedTouches){ if(t.target.closest("#joy")||t.target.closest(".fps-act"))continue; if(lookId===null){ lookId=t.identifier; lx=t.clientX; ly=t.clientY; } } },{passive:false});
stage.addEventListener("touchmove",e=>{ for(const t of e.changedTouches){ if(t.identifier!==lookId)continue; const dx=t.clientX-lx,dy=t.clientY-ly; lx=t.clientX; ly=t.clientY; if(scr==="play"){ P.yaw-=dx*0.005; P.pitch=Math.max(-1.1,Math.min(1.1,P.pitch-dy*0.004)); } } e.preventDefault(); },{passive:false});
function lookEnd(e){ for(const t of e.changedTouches){ if(t.identifier===lookId) lookId=null; } }
stage.addEventListener("touchend",lookEnd); stage.addEventListener("touchcancel",lookEnd);

$("sk-close").onclick=()=>$("skills").hidden=true;
$("menu-btn").onclick=()=>{ if(!P)return; $("menu-stats").innerHTML=`Niveau ${P.niv} · 💥 ${P.deg} dégâts · 💪 ${P.force} · 🧠 ${P.intel}`; $("menu").hidden=false; };
$("menu-resume").onclick=()=>$("menu").hidden=true;
$("menu-restart").onclick=()=>{ try{localStorage.removeItem(SAVE);}catch(e){} location.reload(); };

/* ===================== DÉMARRAGE ===================== */
requestAnimationFrame(loop);
(function boot(){
  if(typeof THREE==="undefined"){ $("cine").hidden=true; $("loading").hidden=false; $("loading").innerHTML="<div>Impossible de charger la 3D (connexion ?). Recharge la page.</div>"; return; }
  if(load() && scr!=="cine"){
    $("cine").hidden=true;
    $("loading").hidden=false;
    setTimeout(()=>{ try{ buildWorld(); }catch(err){ $("loading").innerHTML="<div>Erreur 3D : "+err.message+"</div>"; return; } $("loading").hidden=true; if(scr==="combat") scr="play"; enterPlay(); toast("Partie reprise. ⚙︎ pour recommencer."); },30);
  } else { scr="cine"; runCine(); }
})();
</script>
