<style>
  :root{
    --bg:#15111b; --bg2:#1f1826; --panel:#271f30; --panel2:#322740;
    --ink:#f3ebe0; --ink-soft:#b6a9bd; --line:#4a3d57;
    --red:#d64545; --red-deep:#b23232; --rage:#e8663a;
    --gold:#e8c06a; --green:#6fbf73; --blue:#6aa9e8; --intel:#9b7fe0;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  [hidden]{display:none!important;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:var(--safe-t) 0 var(--safe-b);}
  .serif{font-family:'Newsreader',Georgia,serif;}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}

  /* ===== top bar ===== */
  .topbar{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;}
  .topbar a{color:var(--ink-soft);text-decoration:none;font-size:0.82rem;}
  .topbar .ttl{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:1rem;letter-spacing:.5px;}
  .topbar .ttl b{color:var(--rage);}

  /* ===== game frame ===== */
  #frame{width:100%;max-width:460px;flex:1;display:flex;flex-direction:column;position:relative;min-height:0;}

  /* HUD */
  #hud{padding:6px 12px 2px;font-size:0.8rem;}
  .bars{display:flex;gap:8px;margin-bottom:5px;}
  .bar{flex:1;}
  .bar .lab{display:flex;justify-content:space-between;font-size:0.68rem;color:var(--ink-soft);margin-bottom:2px;}
  .bar .track{height:9px;background:var(--panel);border-radius:5px;overflow:hidden;}
  .bar .fill{height:100%;transition:width .25s;}
  .fill.pv{background:linear-gradient(90deg,var(--red-deep),var(--red));}
  .fill.rage{background:linear-gradient(90deg,#c23,var(--rage));}
  .stats{display:flex;gap:10px;flex-wrap:wrap;font-size:0.76rem;color:var(--ink-soft);}
  .stats b{color:var(--ink);}
  .stats .deg b{color:var(--rage);}

  /* canvas */
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px 0;}
  canvas{background:#0e0a12;border-radius:10px;image-rendering:auto;max-width:100%;max-height:100%;box-shadow:0 8px 30px rgba(0,0,0,.5);}

  /* controls */
  #controls{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px;gap:12px;}
  .dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px;}
  .dpad button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-size:1.2rem;color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .dpad button:active{background:var(--rage);}
  .dpad .sp{visibility:hidden;}
  .act{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .act .a-btn{width:70px;height:48px;border-radius:12px;background:var(--rage);color:#fff;font-weight:700;font-size:0.92rem;box-shadow:0 3px 0 #a3421f;}
  .act .a-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a3421f;}
  .act .mini{display:flex;gap:6px;}
  .act .mini button{width:46px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:0.7rem;color:var(--ink-soft);font-weight:600;}
  .hint-kb{text-align:center;font-size:0.68rem;color:var(--ink-soft);padding-bottom:6px;}
  @media(hover:none){.hint-kb{display:none;}}

  /* ===== overlays ===== */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(10,7,14,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;}
  .card{width:100%;max-width:420px;background:var(--bg2);border:1.5px solid var(--line);border-radius:18px;padding:22px;max-height:90vh;overflow-y:auto;}
  .card h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:1.5rem;margin-bottom:8px;line-height:1.1;}
  .card h2 b{color:var(--rage);}
  .card p{color:var(--ink-soft);font-size:0.94rem;line-height:1.55;margin-bottom:12px;}
  .card p em{color:var(--ink);font-style:italic;}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;font-weight:600;font-size:0.98rem;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);transition:background .15s,border-color .15s;}
  .btn:hover{border-color:var(--rage);}
  .btn.primary{background:var(--rage);color:#fff;border-color:var(--rage);}
  .btn.ghost{background:none;color:var(--ink-soft);border-color:transparent;font-size:0.84rem;padding:8px;}
  .big-emoji{font-size:3rem;text-align:center;margin-bottom:6px;}

  /* intro crawl */
  #intro .card{text-align:left;}
  .intro-line{opacity:0;animation:fade .6s forwards;}
  @keyframes fade{to{opacity:1;}}

  /* combat */
  #combat .card{max-width:430px;}
  .enemy-zone{text-align:center;margin-bottom:10px;}
  .enemy-emoji{font-size:3.4rem;line-height:1;}
  .enemy-emoji.hit{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .enemy-name{font-family:'Newsreader',Georgia,serif;font-size:1.15rem;font-weight:600;margin-top:4px;}
  .enemy-tag{font-size:0.72rem;color:var(--ink-soft);}
  .ehp{height:11px;background:var(--panel);border-radius:6px;overflow:hidden;margin:8px auto 0;max-width:260px;}
  .ehp .fill{height:100%;background:linear-gradient(90deg,#8a2,#6fbf73);transition:width .3s;}
  .log{min-height:44px;background:var(--panel);border-radius:10px;padding:10px 12px;font-size:0.88rem;line-height:1.4;margin:12px 0;color:var(--ink);}
  .pstat{display:flex;gap:8px;margin-bottom:10px;}
  .pstat .b{flex:1;}
  .pstat .lab{font-size:0.66rem;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .pstat .track{height:8px;background:var(--panel);border-radius:5px;overflow:hidden;margin-top:2px;}
  .moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .move{padding:12px 10px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);text-align:left;}
  .move:hover:not(:disabled){border-color:var(--rage);}
  .move:disabled{opacity:.4;}
  .move .mn{font-weight:700;font-size:0.92rem;display:block;}
  .move .md{font-size:0.7rem;color:var(--ink-soft);}

  /* skills */
  .skill{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--panel);}
  .skill .se{font-size:1.6rem;}
  .skill .si{flex:1;}
  .skill .sn{font-weight:700;font-size:0.92rem;}
  .skill .sd{font-size:0.74rem;color:var(--ink-soft);}
  .skill button{padding:9px 12px;border-radius:9px;background:var(--rage);color:#fff;font-weight:700;font-size:0.8rem;white-space:nowrap;}
  .skill button:disabled{background:var(--panel2);color:var(--ink-soft);}
  .skill.owned{opacity:.6;}
  .pts{text-align:center;font-size:0.9rem;color:var(--gold);margin-bottom:12px;}

  .toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%) translateY(-16px);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:0.84rem;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:92%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<script>
"use strict";
/* =========================================================
   RAGE DE DENT — tranche « Hôpital »
   ========================================================= */
const SAVE="rage-de-dent-v1";
const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
const COLS=13, ROWS=14, TILE=34;
cv.width=COLS*TILE; cv.height=ROWS*TILE;

/* ---- carte (# mur, . sol) ---- */
const MAP=[
 "#############",
 "#...........#",
 "#...........#",
 "#....###....#",
 "#....#.#....#",
 "#......#....#",
 "#...........#",
 "#...........#",
 "#....###....#",
 "#...........#",
 "#...........#",
 "#...........#",
 "#####...#####",
 "######.######",
].map(r=>r.split(""));
function wall(x,y){ return !MAP[y]||!MAP[y][x]||MAP[y][x]==="#"; }

/* ---- bestiaire ---- */
const BEST={
 mamie:{nom:"Mamie en déambulateur",emoji:"👵",pv:14,force:4,xp:4,deg:10,fort:false,cri:"« POUSSEZ-VOUS, bon sang ! »"},
 perf:{nom:"Patient sous perfusion",emoji:"🤕",pv:12,force:3,xp:4,deg:8,fort:false,cri:"Il traîne sa potence à roulettes vers toi."},
 aide:{nom:"Aide-soignant",emoji:"🧑‍⚕️",pv:22,force:6,xp:9,deg:16,fort:true,cri:"« Monsieur, vous DEVEZ vous recoucher. »"},
 infirmier:{nom:"Infirmier costaud",emoji:"💪",pv:30,force:8,xp:13,deg:22,fort:true,cri:"Il craque ses doigts un par un."},
 medecin:{nom:"Le Médecin",emoji:"👨‍⚕️",pv:58,force:10,xp:30,deg:60,fort:true,boss:true,cri:"« On va vous garder… pour des examens. »"},
};

/* ---- état ---- */
let P, ENT, scr="intro";

function freshGame(){
  P={ x:2,y:2, niv:1,xp:0,xpNext:12, pvMax:30,pv:30, force:5,intel:1,
      rage:0,rageMax:100, deg:0, pts:0,
      skills:{}, booksRead:0, bossDown:false };
  ENT=[
    {t:"enemy",k:"mamie",x:6,y:2,alive:true},
    {t:"enemy",k:"perf",x:3,y:6,alive:true},
    {t:"enemy",k:"aide",x:9,y:7,alive:true},
    {t:"enemy",k:"infirmier",x:6,y:9,alive:true},
    {t:"enemy",k:"medecin",x:6,y:11,alive:true},
    {t:"book",x:10,y:2,used:false,emoji:"📖",
      titre:"« Vaincre sa colère en 7 étapes »", gain:3},
    {t:"book",x:2,y:10,used:false,emoji:"📕",
      titre:"« Le grand livre des insultes fleuries »", gain:3},
    {t:"smash",x:10,y:10,broken:false,emoji:"🥤",nom:"Distributeur de boissons",force:6,deg:40,soin:10},
    {t:"smash",x:2,y:4,broken:false,emoji:"🧺",nom:"Chariot de linge sale",force:4,deg:18,soin:0},
    {t:"exit",x:6,y:13,emoji:"🚪"},
  ];
}
function entAt(x,y){ return ENT.find(e=>e.x===x&&e.y===y&&!(e.t==="enemy"&&!e.alive)&&!(e.t==="book"&&e.used)&&!(e.t==="smash"&&e.broken)); }

/* ---- save ---- */
function save(){ try{ localStorage.setItem(SAVE,JSON.stringify({P,ENT,scr})); }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem(SAVE)); if(d&&d.P){P=d.P;ENT=d.ENT;return true;} }catch(e){} return false; }

/* ======================= RENDU CARTE ======================= */
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const w=wall(x,y);
    ctx.fillStyle=w?"#2a2033":"#1b1525";
    ctx.fillRect(x*TILE,y*TILE,TILE-1,TILE-1);
    if(!w){ ctx.fillStyle="#241c30"; ctx.fillRect(x*TILE+TILE-3,y*TILE+TILE-3,2,2); }
  }
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=Math.floor(TILE*0.66)+"px serif";
  for(const e of ENT){
    if(e.t==="enemy"&&!e.alive) continue;
    if(e.t==="book"&&e.used) continue;
    if(e.t==="smash"&&e.broken) continue;
    const cx=e.x*TILE+TILE/2, cy=e.y*TILE+TILE/2;
    let em=e.emoji|| (e.t==="enemy"?BEST[e.k].emoji:"?");
    if(e.t==="enemy"&&BEST[e.k].boss){ ctx.font=Math.floor(TILE*0.78)+"px serif"; }
    ctx.fillText(em,cx,cy+1);
    if(e.t==="enemy"&&BEST[e.k].boss){ ctx.font=Math.floor(TILE*0.66)+"px serif"; }
  }
  // joueur
  ctx.font=Math.floor(TILE*0.7)+"px serif";
  ctx.fillText("🧍",P.x*TILE+TILE/2,P.y*TILE+TILE/2+1);
}

/* ======================= HUD ======================= */
function hud(){
  $("pv-bar").style.width=Math.max(0,P.pv/P.pvMax*100)+"%";
  $("pv-txt").textContent=Math.max(0,P.pv)+"/"+P.pvMax;
  $("rage-bar").style.width=(P.rage/P.rageMax*100)+"%";
  $("rage-txt").textContent=Math.round(P.rage);
  $("s-niv").textContent=P.niv; $("s-force").textContent=P.force;
  $("s-intel").textContent=P.intel; $("s-deg").textContent=P.deg;
  $("s-pts").hidden=P.pts<=0; $("s-pts-n").textContent=P.pts;
  $("btn-skills").style.opacity=P.pts>0?"1":".5";
}

/* ======================= DÉPLACEMENT ======================= */
function tryMove(dx,dy){
  if(scr!=="play") return;
  const nx=P.x+dx, ny=P.y+dy;
  if(wall(nx,ny)) return;
  const e=entAt(nx,ny);
  if(e){
    if(e.t==="enemy"){ startCombat(e); return; }
    if(e.t==="book"){ readBook(e); return; }
    if(e.t==="smash"){ smash(e); return; }
    if(e.t==="exit"){ tryExit(); return; }
  }
  P.x=nx; P.y=ny; draw(); save();
  if(Math.random()<0.06) toast("🦷 Ta dent t'élance un coup…");
}
function interact(){ // bouton Action : agit sur une case adjacente si entité
  if(scr!=="play") return;
  for(const [dx,dy] of [[0,0],[0,-1],[0,1],[-1,0],[1,0]]){
    const e=entAt(P.x+dx,P.y+dy);
    if(e&&e.t!=="exit"){ tryMove(dx,dy); return; }
    if(e&&e.t==="exit"){ tryExit(); return; }
  }
  toast("Rien à faire ici.");
}

/* ---- livres ---- */
function readBook(b){
  b.used=true;
  let g=b.gain + (P.skills.lecture?Math.ceil(b.gain*0.5):0);
  P.intel+=g;
  draw(); hud(); save();
  showScreen(`<div class="big-emoji">${b.emoji}</div><h2>Tu lis ${b.titre}</h2>
    <p>Tu ne comprends pas tout, mais quelque chose infuse. <em>+${g} Intelligence.</em></p>
    <p style="color:var(--intel)">💡 Astuce : transforme ton Intelligence en Force pure avec le bouton <b>🔮 Magie</b>. Plus tu lis, plus tu cognes, plus tu casses.</p>
    <div class="choices"><button class="btn primary" onclick="closeScreen()">OK</button></div>`);
}

/* ---- casser ---- */
function smash(o){
  if(P.force<o.force){
    toast("💪 Trop costaud (Force "+o.force+" requise). Lis, muscle-toi.");
    return;
  }
  o.broken=true; P.deg+=o.deg;
  if(o.soin){ P.pv=Math.min(P.pvMax,P.pv+o.soin); }
  draw(); hud(); save();
  toast("💥 "+o.nom+" explosé ! +"+o.deg+" dégâts"+(o.soin?" · +"+o.soin+" PV":""));
}

/* ---- sortie / fin de tranche ---- */
function tryExit(){
  if(!P.bossDown){ toast("🚪 Le Médecin te barre la route. Occupe-toi de lui d'abord."); return; }
  endSlice();
}

/* ---- transmutation ---- */
function transmute(){
  if(scr!=="play") return;
  const cost=3, gain=2;
  if(P.intel<cost){ toast("🧠 Pas assez d'Intelligence (il en faut "+cost+"). Lis un bouquin."); return; }
  P.intel-=cost; P.force+=gain; hud(); save();
  toast("🔮 "+cost+" 🧠 → +"+gain+" 💪 Force. Tu sens tes bras gonfler.");
}

/* ======================= COMBAT ======================= */
let C=null;
function startCombat(e){
  scr="combat";
  const b=BEST[e.k];
  C={ ref:e, k:e.k, nom:b.nom, emoji:b.emoji, fort:b.fort, boss:!!b.boss,
      pvMax:b.pv, pv:b.pv, force:b.force, xp:b.xp, deg:b.deg, buff:0, turn:0, debuff:0 };
  $("c-emoji").textContent=b.emoji;
  $("c-name").textContent=b.nom;
  $("c-tag").textContent=(b.boss?"BOSS · ":"")+(b.fort?"Ennemi coriace":"Ennemi faible");
  log(b.cri);
  $("combat").hidden=false;
  renderCombat();
}
function log(t){ $("c-log").innerHTML=t; }
function renderCombat(){
  $("c-hp").style.width=Math.max(0,C.pv/C.pvMax*100)+"%";
  $("c-pv").style.width=Math.max(0,P.pv/P.pvMax*100)+"%";
  $("c-pv-txt").textContent=Math.max(0,P.pv)+"/"+P.pvMax;
  $("c-rage").style.width=(P.rage/P.rageMax*100)+"%";
  $("c-rage-txt").textContent=Math.round(P.rage);
  const canSort=P.sortCd? false:true;
  const moves=[
    {id:"patate",n:"👊 Patate",d:"Force +rage"},
    {id:"insulte",n:"🗯️ Insulte sismique",d:"40 rage · gros dégâts",dis:P.rage<40},
    {id:"regard",n:"👁️ Regard noir",d:C.fort?"risqué sur les forts":"fait fuir les faibles"},
    {id:"sort",n:"✨ Sort (Intelligence)",d:P.sortCd?"recharge…":"dégâts = 🧠×3",dis:!!P.sortCd},
    {id:"fuir",n:"🏃 Fuir",d:C.boss?"impossible":"tenter de s'enfuir",dis:C.boss},
  ];
  $("c-moves").innerHTML=moves.map(m=>`<button class="move" data-m="${m.id}" ${m.dis?"disabled":""}><span class="mn">${m.n}</span><span class="md">${m.d}</span></button>`).join("");
  $("c-moves").querySelectorAll(".move").forEach(b=>b.onclick=()=>playerMove(b.dataset.m));
}
function rnd(n){ return Math.floor(Math.random()*n); }
function hitAnim(){ $("c-emoji").classList.remove("hit"); void $("c-emoji").offsetWidth; $("c-emoji").classList.add("hit"); }

function playerMove(m){
  if(scr!=="combat") return;
  // rage de dent : peut sauter le tour
  if(Math.random()<0.1){
    log("🦷 Ta rage de dent t'élance ! Tu te masses la mâchoire et perds ton tour…");
    disableMoves(); setTimeout(enemyTurn,900); return;
  }
  let dmg=0, txt="";
  if(m==="patate"){
    dmg=P.force+rnd(4); P.rage=Math.min(P.rageMax,P.rage+15);
    txt="👊 Tu balances une grosse patate. "+dmg+" dégâts.";
  } else if(m==="insulte"){
    P.rage-=40; dmg=Math.round(P.force*2.2)+rnd(5)+(P.skills.sangchaud?6:0);
    txt="🗯️ Tu hurles une insulte si fort que l'air tremble ! "+dmg+" dégâts.";
  } else if(m==="regard"){
    const fortEnnemi=C.fort && !(P.skills.sangfroid && C.k==="aide");
    if(!fortEnnemi){ log("👁️ Ton regard noir le glace. Il s'enfuit en couinant.");
      endCombat(false,true); return; }
    else { C.buff+=3; P.rage=Math.min(P.rageMax,P.rage+25);
      txt="👁️ Tu le fixes… mais ça le rend FURIEUX (+force). Tu encaisses la pression (+rage)."; dmg=0; }
  } else if(m==="sort"){
    dmg=P.intel*3+rnd(3); P.sortCd=2;
    txt="✨ Tu transmutes ta pensée en déflagration. "+dmg+" dégâts.";
  } else if(m==="fuir"){
    if(Math.random()<0.55){ log("🏃 Tu détales dans le couloir !"); endCombat(false,true); return; }
    txt="🏃 Raté ! Il te rattrape."; dmg=0;
  }
  if(dmg>0) hitAnim();
  C.pv-=dmg;
  log(txt); renderCombat(); disableMoves();
  if(C.pv<=0){ setTimeout(()=>endCombat(true),650); return; }
  setTimeout(enemyTurn,750);
}
function disableMoves(){ $("c-moves").querySelectorAll(".move").forEach(b=>b.disabled=true); }
function enemyTurn(){
  if(scr!=="combat") return;
  if(P.sortCd) P.sortCd--;
  let txt="", dmg=C.force+C.buff+rnd(3);
  if(C.boss){
    C.turn++;
    if(C.turn%3===0){ P.rage=Math.max(0,P.rage-20); txt="📋 Le Médecin te tend une ordonnance : « du calme ». Ta rage retombe un peu (−20)."; dmg=Math.round(dmg*0.6); }
  }
  const def=(P.skills.sangfroid?2:0);
  dmg=Math.max(1,dmg-def);
  P.pv-=dmg;
  txt=(txt?txt+" ":"")+C.emoji+" riposte : −"+dmg+" PV.";
  log(txt); renderCombat();
  if(P.pv<=0){ setTimeout(gameOver,700); return; }
  setTimeout(()=>{ if(scr==="combat") renderCombat(); },300);
}
function endCombat(win,fled){
  const e=C.ref;
  $("combat").hidden=true; scr="play";
  if(win){
    e.alive=false;
    P.deg+=C.deg; gainXp(C.xp);
    if(C.boss){ P.bossDown=true; }
    toast("✅ "+C.nom+" à terre ! +"+C.xp+" XP · +"+C.deg+" dégâts");
    if(C.boss){ setTimeout(bossBeaten,500); }
  } else if(fled){
    // fui ou effrayé : l'ennemi disparaît sans récompense d'xp
    e.alive=false; toast("L'ennemi a dégagé. (pas d'XP)");
  }
  P.sortCd=0;
  draw(); hud(); save();
}
function gainXp(n){
  P.xp+=n;
  while(P.xp>=P.xpNext){
    P.xp-=P.xpNext; P.niv++; P.xpNext=Math.round(P.xpNext*1.5);
    P.pvMax+=6; P.pv=P.pvMax; P.force+=1; P.pts+=1;
    if(P.niv%2===0) P.intel+=1;
    toast("⭐ Niveau "+P.niv+" ! +6 PV, +1 Force, +1 point de compétence");
  }
}

/* ======================= COMPÉTENCES ======================= */
const SKILLS=[
  {id:"grosbras",e:"💪",n:"Gros bras",d:"+3 Force tout de suite."},
  {id:"lecture",e:"🧠",n:"Lecture rapide",d:"Les livres rapportent +50% d'Intelligence. (+2 maintenant)"},
  {id:"sangchaud",e:"🔥",n:"Sang chaud",d:"Insulte sismique frappe plus fort. Tu démarres chaque combat avec +25 rage."},
  {id:"sangfroid",e:"🧊",n:"Sang-froid",d:"+10 PV, −2 dégâts subis, et ton Regard noir fait aussi fuir les aides-soignants."},
];
function openSkills(){
  $("sk-pts").textContent="★ "+P.pts+" point"+(P.pts>1?"s":"")+" à dépenser";
  $("sk-list").innerHTML=SKILLS.map(s=>{
    const owned=!!P.skills[s.id];
    return `<div class="skill ${owned?"owned":""}"><div class="se">${s.e}</div>
      <div class="si"><div class="sn">${s.n}</div><div class="sd">${s.d}</div></div>
      <button data-s="${s.id}" ${owned||P.pts<=0?"disabled":""}>${owned?"Acquis":"1 ★"}</button></div>`;
  }).join("");
  $("sk-list").querySelectorAll("button[data-s]").forEach(b=>b.onclick=()=>buySkill(b.dataset.s));
  $("skills").hidden=false;
}
function buySkill(id){
  if(P.skills[id]||P.pts<=0) return;
  P.pts--; P.skills[id]=true;
  if(id==="grosbras") P.force+=3;
  if(id==="lecture") P.intel+=2;
  if(id==="sangchaud") P.rageMax=100;
  if(id==="sangfroid"){ P.pvMax+=10; P.pv+=10; }
  hud(); save(); openSkills();
}

/* ======================= ÉCRANS / HISTOIRE ======================= */
function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2100); }
function showScreen(html){ $("screen-card").innerHTML=html; $("screen").hidden=false; }
function closeScreen(){ $("screen").hidden=true; }
window.closeScreen=closeScreen;

const INTRO=[
 "Dimanche. 8 h 02.",
 "Le chien vient de crotter au milieu du salon.",
 "Il pleut. Ta femme te rappelle qu'on mange chez la belle-famille à midi.",
 "Tu ouvres ton téléphone : notification de la banque.",
 "<em>« Découvert autorisé dépassé : −29 000 €. »</em>",
 "Une rage de dent te vrille la mâchoire. Tu te la masses.",
 "Tout devient noir.",
];
function runIntro(){
  let body=$("intro-body"), i=0;
  body.innerHTML="<h2 class='serif'>Rage de <b>dent</b></h2>";
  $("intro-go").textContent="…";
  const tick=()=>{
    if(i<INTRO.length){
      const p=document.createElement("p"); p.className="intro-line";
      p.innerHTML=INTRO[i]; p.style.animationDelay="0s"; body.appendChild(p);
      i++; setTimeout(tick,900);
    } else { $("intro-go").textContent="Ouvrir les yeux →"; }
  };
  tick();
  $("intro-go").onclick=()=>{ if(i<INTRO.length) return; $("intro").hidden=true; wakeUp(); };
}

function wakeUp(){
  showScreen(`<div class="big-emoji">🛏️</div>
    <h2>Chambre d'hôpital</h2>
    <p>Tu te réveilles sous un néon qui grésille. Des tubes dans le bras, un bip lancinant. Une infirmière s'approche, seringue à la main :</p>
    <p><em>« Vous avez fait un malaise. Tenez, une petite piqûre de calmant, vous allez vous rendormir tranquillement… »</em></p>
    <div class="choices">
      <button class="btn" id="accept">💉 Accepter la piqûre</button>
      <button class="btn primary" id="refuse">✊ Refuser</button>
    </div>`);
  $("accept").onclick=sleepEnding;
  $("refuse").onclick=beginGame;
}
function sleepEnding(){
  showScreen(`<div class="big-emoji">😴</div>
    <h2>FIN.</h2>
    <p>La piqûre fait effet. Tes paupières tombent. Tout se calme. Tu te rendors d'un sommeil profond et sans rêves.</p>
    <p><em>Vous avez bien dormi. Dégâts causés : 0. Belle-famille : jamais affrontée. Rage : intacte, pour une prochaine fois.</em></p>
    <p style="color:var(--gold)">🥚 (Tu viens de trouver la fin secrète. La sagesse, peut-être. Ou la lâcheté.)</p>
    <div class="choices"><button class="btn primary" onclick="location.reload()">Recommencer</button></div>`);
}
function beginGame(){
  freshGame();
  closeScreen();
  showScreen(`<div class="big-emoji">✊</div>
    <h2><b>NON.</b></h2>
    <p>Tu attrapes son poignet. « Pas aujourd'hui. » Tu arraches les perfusions une par une, tu balances les draps et tu poses tes pieds nus sur le lino glacé.</p>
    <p>Debout. En blouse ouverte dans le dos. Le cul à l'air et plus rien à perdre.</p>
    <p><em>Objectif : sortir de cet hôpital. En cassant tout ce qui se met en travers.</em></p>
    <p style="color:var(--ink-soft);font-size:.84rem">Bouge avec les flèches (ou le pavé tactile). Fonce dans les gens pour les combattre, dans les objets pour les défoncer. Lis les livres 📖 pour l'Intelligence, puis 🔮 transmute-la en Force.</p>
    <div class="choices"><button class="btn primary" id="go">Se lever ✊</button></div>`);
  $("go").onclick=()=>{ closeScreen(); enterPlay(); };
}
function enterPlay(){
  scr="play";
  $("hud").hidden=false; $("controls").hidden=false; $("hint-kb").hidden=false;
  draw(); hud(); save();
}

function bossBeaten(){
  showScreen(`<div class="big-emoji">👨‍⚕️💫</div>
    <h2>Le Médecin s'effondre</h2>
    <p>« Les examens… attendront… » Il glisse le long du mur. La double-porte vitrée du hall est juste derrière lui.</p>
    <p><em>La sortie est libre. Marche jusqu'à la porte 🚪.</em></p>
    <div class="choices"><button class="btn primary" onclick="closeScreen()">Y aller</button></div>`);
}
function endSlice(){
  scr="end"; save();
  showScreen(`<div class="big-emoji">🚪🌧️</div>
    <h2>Dehors.</h2>
    <p>Les portes s'ouvrent dans un soupir. L'air froid te gifle, la pluie aussi. Pieds nus sur le parking, Gérard respire un grand coup.</p>
    <p>Devant lui : la ville. Un dimanche gris. Une banque qui ouvre jamais le week-end mais qu'il compte bien défoncer quand même. Et, quelque part au fond de sa mâchoire, <em>la vraie boss qui l'attend.</em></p>
    <p style="color:var(--rage)"><b>Fin de l'épisode 1 — « L'Hôpital »</b><br>Niveau ${P.niv} · 💥 ${P.deg} dégâts · 💪 Force ${P.force} · 🧠 ${P.intel}</p>
    <p style="color:var(--ink-soft);font-size:.84rem">À suivre : « La Rue ». (En construction — reviens bientôt.)</p>
    <div class="choices"><button class="btn primary" onclick="location.reload()">Rejouer l'épisode</button></div>`);
  try{ localStorage.removeItem(SAVE); }catch(e){}
}
function gameOver(){
  scr="over"; $("combat").hidden=true;
  showScreen(`<div class="big-emoji">💀</div>
    <h2>K.O.</h2>
    <p>Gérard s'écroule. On le recouche. On lui remet les tubes. Le bip reprend, lancinant.</p>
    <p><em>Dégâts causés : ${P.deg}. Pas assez pour faire passer la rage.</em></p>
    <div class="choices"><button class="btn primary" onclick="location.reload()">Réessayer</button></div>`);
  try{ localStorage.removeItem(SAVE); }catch(e){}
}

/* ======================= ENTRÉES ======================= */
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","w","z"].includes(k)){ e.preventDefault(); tryMove(0,-1); }
  else if(["arrowdown","s"].includes(k)){ e.preventDefault(); tryMove(0,1); }
  else if(["arrowleft","a","q"].includes(k)){ e.preventDefault(); tryMove(-1,0); }
  else if(["arrowright","d"].includes(k)){ e.preventDefault(); tryMove(1,0); }
  else if(k===" "||k==="enter"){ e.preventDefault(); interact(); }
});
document.querySelectorAll(".dpad button[data-dir]").forEach(b=>{
  const dir={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];
  const go=ev=>{ ev.preventDefault(); tryMove(dir[0],dir[1]); };
  b.addEventListener("click",go);
});
$("btn-action").onclick=interact;
$("btn-trans").onclick=transmute;
$("btn-skills").onclick=()=>{ if(P&&P.pts>0) openSkills(); else toast("Aucun point de compétence pour l'instant."); };
$("sk-close").onclick=()=>$("skills").hidden=true;

/* menu */
$("menu-btn").onclick=()=>{
  if(!P){ return; }
  $("menu-stats").innerHTML=`Niveau ${P.niv} · 💥 ${P.deg} dégâts · 💪 ${P.force} · 🧠 ${P.intel}`;
  $("menu").hidden=false;
};
$("menu-resume").onclick=()=>$("menu").hidden=true;
$("menu-restart").onclick=()=>{ try{localStorage.removeItem(SAVE);}catch(e){} location.reload(); };

/* ======================= DÉMARRAGE ======================= */
(function boot(){
  if(load()){
    // reprise de partie
    $("intro").hidden=true;
    if(scr==="combat"){ scr="play"; } // on ne reprend pas en plein combat
    enterPlay();
    toast("Partie reprise. ⚙︎ pour recommencer.");
  } else {
    runIntro();
  }
})();
</script>
</body>
</html>
