<script>
/* =====================================================================
   VACHES — jeu incrémental. 3 arcs jouables en parallèle + prestige (IA ×100).
   ===================================================================== */
const pasture  = document.getElementById('pasture');
const hudCur    = document.getElementById('hud-cur');
const hudRate   = document.getElementById('hud-rate');
const hudPrest  = document.getElementById('hud-prest');
const tabsEl    = document.getElementById('act-tabs');
const shopEl    = document.getElementById('shop');
const shopList  = document.getElementById('shop-list');
const shopTitle = document.getElementById('shop-title');
const quickBuy  = document.getElementById('quick-buy');
const aiOffer   = document.getElementById('ai-offer');
const SOUNDS = ["meuh1.mp3","meuh2.mp3","meuh3.mp3","meuh4.mp3"];
const MEUHS  = ["Meuh !","MEUH !!","meuuh…","Mooooh","Meuh ?","Meuh meuh","Muh."];

/* ---- CONFIG DES 3 ARCS ---- */
const ACTS = [
  {
    key:'steak', title:'L\'empire du steak', emoji:'🥩',
    cur:{emoji:'🥩', name:'steaks'}, sub:{emoji:'🥛', name:'bouteilles de lait', per:10},
    entity:'cow', clickBase:1,
    click:{id:'seau', emoji:'🪣', name:'Traite améliorée', desc:'Tu tires plus de lait à chaque clic.', base:15, mul:1.5, add:1},
    tiers:[
      {id:'fermier',  emoji:'🧑‍🌾', name:'Fermier',      desc:'Trait des bouteilles de lait.',     base:1,     mul:1.13, rate:1},
      {id:'ferme',    emoji:'🚜',   name:'Ferme',        desc:'Produit des fermiers toute seule.', base:120,   mul:1.16, rate:0.5, revealBy:{tier:'fermier', n:20}},
      {id:'coop',     emoji:'🏘️',   name:'Coopérative',  desc:'Fédère des fermes.',                base:3000,  mul:1.18, rate:0.3, revealBy:{tier:'ferme', n:10}},
      {id:'monsanto', emoji:'🏭',   name:'Monsanto',     desc:'Rachète des coopératives en série.',base:80000, mul:1.20, rate:0.2, revealBy:{tier:'coop', n:10}},

/* ---- ÉTAT ---- */
const SAVE_KEY = 'vaches-idle-v4';
let S;
function freshActState(a){
  const s={cur:0, sub:0, earned:0, clickLvl:0, b:{}, u:{}};
  a.tiers.forEach(t=> s.b[t.id]={bought:0, amount:0});
  a.upg.forEach(u=> s.u[u.id]=0);
  return s;
}
function freshState(keepIa){ return { ia:keepIa||0, unlocked:1, view:0, lastTs:Date.now(), acts:ACTS.map(freshActState) }; }
function load(){ try{ const r=JSON.parse(localStorage.getItem(SAVE_KEY)); if(r&&r.acts&&r.acts.length===3) return r; }catch(e){} return freshState(0); }
function save(){ S.lastTs=Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
S = load();

/* ---- HELPERS ---- */
const UNITS=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<1000) return (n%1===0? n : Math.floor(n*10)/10).toString();
  let u=0; while(n>=1000 && u<UNITS.length-1){ n/=1000; u++; }
  if(u>=UNITS.length-1 && n>=1000) return n.toExponential(2);
  return (n<10? n.toFixed(2): n<100? n.toFixed(1): Math.floor(n)) + UNITS[u];
}
const A   = i => ACTS[i];
const st  = i => S.acts[i];
const view= () => S.view;
function PREST(){ return Math.pow(100, S.ia); }
function amt(i,id){ const b=st(i).b[id]; return b? b.amount:0; }
function upgMult(i){ let m=1; A(i).upg.forEach(u=>{ if(u.kind==='mult'){ const L=st(i).u[u.id]||0; if(L>0) m*=(1+L*u.boost); } }); return m; }
function costFactor(i){ let f=1; A(i).upg.forEach(u=>{ if(u.kind==='cost' && u.once && st(i).u[u.id]) f*=(1-u.reduce); }); return f; }
function isRevealed(i,spec){ if(!spec.revealBy) return true; return amt(i,spec.revealBy.tier) >= spec.revealBy.n; }
function clickValue(i){ return A(i).clickBase + (st(i).clickLvl||0)*A(i).click.add; }
function perSecond(i){ const a=A(i),s=st(i),t0=a.tiers[0]; return s.b[t0.id].amount * t0.rate * upgMult(i) * PREST(); }

/* ---- PRODUCTION ---- */
function addRaw(i, amount){
  const a=A(i), s=st(i);
  if(a.sub){ s.sub+=amount; if(s.sub>=a.sub.per){ const n=Math.floor(s.sub/a.sub.per); s.sub-=n*a.sub.per; s.cur+=n; s.earned+=n; } }
  else { s.cur+=amount; s.earned+=amount; }
}
function tick(dt){
  for(let i=0;i<S.unlocked;i++){
    const a=A(i), s=st(i), m=upgMult(i)*PREST();
    for(let k=a.tiers.length-1;k>=1;k--){ const up=a.tiers[k], dn=a.tiers[k-1]; s.b[dn.id].amount += s.b[up.id].amount * up.rate * dt; }
    const t0=a.tiers[0];
    addRaw(i, s.b[t0.id].amount * t0.rate * dt * m);
  }
  if(S.unlocked>=3 && amt(2,'robot')>=A(2).endgame.n && !inFinale){ aiOffer.classList.add('on'); }
}

/* ---- COÛTS / ACHATS ---- */
function tierCost(i,t){ return t.base * Math.pow(t.mul, st(i).b[t.id].bought) * costFactor(i); }
function clickCost(i){ const c=A(i).click; return c.base*Math.pow(c.mul, st(i).clickLvl) * costFactor(i); }
function upgCost(i,u){ if(u.once) return u.base*costFactor(i); return u.base*Math.pow(u.mul, st(i).u[u.id]||0)*costFactor(i); }
function bulk(base0,mul,k){ return base0*(Math.pow(mul,k)-1)/(mul-1); }
function maxAff(base0,mul,money){ if(money<base0) return 0; return Math.floor(Math.log(1+money*(mul-1)/base0)/Math.log(mul)); }

function buyTier(i,t,mode){
  const s=st(i); let k = mode==='max'? maxAff(tierCost(i,t),t.mul,s.cur) : parseInt(mode);
  if(k<1) return false;
  const base0=tierCost(i,t); let cost=bulk(base0,t.mul,k);
  while(k>0 && cost>s.cur){ k--; cost=bulk(base0,t.mul,k); }
  if(k<1||cost>s.cur) return false;
  s.cur-=cost; s.b[t.id].bought+=k; s.b[t.id].amount+=k; return true;
}
function buyClick(i,mode){
  const s=st(i), c=A(i).click; let k = mode==='max'? maxAff(clickCost(i),c.mul,s.cur) : parseInt(mode);
  if(k<1) return false;
  const base0=clickCost(i); let cost=bulk(base0,c.mul,k);
  while(k>0 && cost>s.cur){ k--; cost=bulk(base0,c.mul,k); }
  if(k<1||cost>s.cur) return false;
  s.cur-=cost; s.clickLvl+=k; return true;
}
function buyUpg(i,u,mode){
  const s=st(i);
  if(u.once){ if(s.u[u.id]) return false; const c=upgCost(i,u); if(c>s.cur) return false; s.cur-=c; s.u[u.id]=1; return true; }
  let k = mode==='max'? maxAff(upgCost(i,u),u.mul,s.cur) : parseInt(mode);
  if(k<1) return false;
  const base0=upgCost(i,u); let cost=bulk(base0,u.mul,k);
  while(k>0 && cost>s.cur){ k--; cost=bulk(base0,u.mul,k); }
  if(k<1||cost>s.cur) return false;
  s.cur-=cost; s.u[u.id]=(s.u[u.id]||0)+k; return true;
}
function buyAll(){
  const i=view();
  for(let pass=0; pass<60; pass++){
    let did=false;
    if(isRevealed(i,A(i).click) && buyClick(i,'max')) did=true;
    A(i).tiers.forEach(t=>{ if(isRevealed(i,t) && buyTier(i,t,'max')) did=true; });
    A(i).upg.forEach(u=>{ if(isRevealed(i,u) && buyUpg(i,u,'max')) did=true; });
    if(!did) break;
  }
  renderShop(); save();
}

/* ---- DÉBLOCAGE ARC SUIVANT ---- */
function investNext(){
  const i=S.unlocked-1, nx=A(i).next;
  if(!nx || st(i).cur<nx.cost) return;
  st(i).cur-=nx.cost; S.unlocked++;
  setView(S.unlocked-1);
  showMilestone(A(S.view).emoji, A(S.view).title);
  save();
}

/* ---- VUE / ONGLETS ---- */
function setView(i){
  S.view=i;
  document.body.className = i===1?'view-1':i===2?'view-2':'';
  clearFloaters(); for(let k=0;k<4;k++) setTimeout(spawnFloater, k*350);
  renderTabs(); renderAll();
}
function renderTabs(){
  tabsEl.innerHTML='';
  ACTS.forEach((a,i)=>{
    const b=document.createElement('button'); b.className='act-tab';
    if(i<S.unlocked){
      if(i===S.view) b.classList.add('on');
      b.textContent=a.emoji; b.title=a.title;
      b.onclick=()=>setView(i);
    } else if(i===S.unlocked){
      const nx=A(i-1).next, can=nx && st(i-1).cur>=nx.cost;
      b.classList.add('locked'); if(can) b.classList.add('can-unlock');
      b.textContent='🔒'; b.title=(nx?nx.title+' — '+fmt(nx.cost)+' '+A(i-1).cur.emoji:'');
      b.onclick=()=>{ if(can) investNext(); else if(nx){ const em=A(i-1).cur.emoji; showMilestone('🔒','Il te faut '+fmt(nx.cost)+' '+em+' dans l\'arc précédent'); } };
    } else { b.classList.add('locked'); b.textContent='·'; b.disabled=true; }
    tabsEl.appendChild(b);
  });
}

function clearFloaters(){ pasture.querySelectorAll('.floater').forEach(f=>f.remove()); }
function rand(a,b){ return Math.random()*(b-a)+a; }
function playMoo(){ try{ new Audio(SOUNDS[Math.floor(Math.random()*SOUNDS.length)]).play().catch(()=>{}); }catch(e){} }
const CODE_SNIPPETS=['<span class="k">def</span> <span class="f">train</span>():','<span class="k">while</span> <span class="k">True</span>:','<span class="k">import</span> <span class="s">torch</span>','model.<span class="f">fit</span>(x, y)','<span class="k">return</span> steak','AGI = <span class="k">True</span>'];
function spawnFloater(){
  const a=A(view()), ltr=Math.random()<0.5, el=document.createElement('div');
  el.className='floater '+(ltr?'ltr':'rtl');
  el.style.cssText=`top:${rand(4,80)}vh;animation-duration:${rand(13,25)}s;`;
  if(a.entity==='cow'){ el.classList.add('cow'); el.style.width=rand(8,15)+'vw'; const img=document.createElement('img'); img.src='vache.png'; img.alt='Vache'; img.draggable=false; el.appendChild(img); }
  else if(a.entity==='chip'){ el.classList.add('chip'); el.textContent='NVIDIA'; }
  else { el.classList.add('code'); el.innerHTML=CODE_SNIPPETS[Math.floor(Math.random()*CODE_SNIPPETS.length)]; }
  el.addEventListener('click', e=>{ e.stopPropagation(); collect(el,e.clientX,e.clientY); });
  el.addEventListener('animationend', ()=>el.remove());
  pasture.appendChild(el);
}
function collect(el,x,y){
  const i=view(), a=A(i);
  const reward=Math.max(clickValue(i)*PREST(), Math.floor(perSecond(i)*0.05));
  addRaw(i,reward);
  if(a.entity==='cow') playMoo();
  const gEm=a.sub?a.sub.emoji:a.cur.emoji;
  const old=el.querySelector('.bubble'); if(old) old.remove();
  const b=document.createElement('div'); b.className='bubble';
  b.textContent = a.entity==='cow'?MEUHS[Math.floor(Math.random()*MEUHS.length)]:(a.entity==='chip'?'⚙️ +'+fmt(reward):'</> +'+fmt(reward));
  el.appendChild(b); b.addEventListener('animationend',()=>b.remove());
  if(x!=null){ const g=document.createElement('div'); g.className='gain-pop'; g.textContent='+'+fmt(reward)+' '+gEm; g.style.left=x+'px'; g.style.top=y+'px'; document.body.appendChild(g); g.addEventListener('animationend',()=>g.remove()); }
  updateHUD();
}

function showMilestone(emoji,label){ const el=document.createElement('div'); el.className='milestone-popup'; el.innerHTML=`${emoji}<br><span>${label}</span>`; document.body.appendChild(el); el.addEventListener('animationend',()=>el.remove()); }

function updateHUD(){
  const i=view(), a=A(i), s=st(i);
  hudCur.textContent = fmt(Math.floor(s.cur))+' '+a.cur.emoji;
  const ps=perSecond(i);
  if(a.sub){ const bits=[a.sub.emoji+' '+Math.floor(s.sub)+'/'+a.sub.per]; bits.push(ps>0?'+'+fmt(ps)+' '+a.sub.emoji+'/s':'clique les vaches'); hudRate.textContent=bits.join(' · '); }
  else hudRate.textContent = ps>0?('+'+fmt(ps)+' '+a.cur.name+'/s'):('clique '+(a.entity==='chip'?'les puces':'le code'));
  hudPrest.textContent = S.ia>0 ? ('🤖 '+S.ia+' IA · production ×'+fmt(PREST())) : '';
}
function updateShopScore(){ const a=A(view()); const sub=a.sub?` · ${a.sub.emoji} ${Math.floor(st(view()).sub)}/${a.sub.per}`:''; shopTitle.textContent = fmt(Math.floor(st(view()).cur))+' '+a.cur.emoji+sub; }

function itemCard(extra, emoji, name, owned, desc, prodLine, cost, money, onclick, done){
  const div=document.createElement('div');
  if(done){ div.className='item '+extra+' cant'; div.innerHTML=`<div class="item-emoji">${emoji}</div><div class="item-name">${name}</div><div class="item-owned">${owned}</div><div class="item-desc">${desc}</div><div class="item-cost">Acquis</div>`; return div; }
  const can = cost!=null && cost<=money;
  div.className='item '+extra+(can?' affordable':' cant');
  div.innerHTML=`<div class="item-emoji">${emoji}</div><div class="item-name">${name}</div><div class="item-owned">${owned}</div><div class="item-desc">${desc}</div>${prodLine||''}<div class="item-cost">${cost==null?'':fmt(Math.ceil(cost))+' '+A(view()).cur.emoji}</div>`;
  if(can && onclick) div.onclick=onclick;
  return div;
}
function lockedCard(spec){
  const need=spec.revealBy, needName=(A(view()).tiers.find(t=>t.id===need.tier)||{name:need.tier}).name;
  const div=document.createElement('div'); div.className='item locked';
  div.innerHTML=`<div class="item-emoji">🔒</div><div class="item-name">???</div><div class="item-owned"></div><div class="item-desc">Débloqué à ${need.n} ${needName.toLowerCase()}${need.n>1?'s':''}</div>`;
  return div;
}
function rowProducer(i,t){
  const s=st(i), idx=A(i).tiers.indexOf(t);
  const outUnit = idx===0 ? (A(i).sub?A(i).sub.name:A(i).cur.name) : A(i).tiers[idx-1].name.toLowerCase()+'s';
  const eachRate = idx===0 ? t.rate*upgMult(i)*PREST() : t.rate;
  const total = s.b[t.id].amount*eachRate;
  const prod = s.b[t.id].amount>=1 ? `<div class="item-prod">▲ +${fmt(total)} ${outUnit}/s au total</div>`:'';
  return itemCard('', t.emoji, t.name, fmt(Math.floor(s.b[t.id].amount)), t.desc+` <b style="color:var(--ink-soft)">(${fmt(eachRate)} ${outUnit}/s ch.)</b>`, prod, tierCost(i,t), s.cur, ()=>{ if(buyTier(i,t,buyMode)){renderShop();save();} });
}
function rowClick(i){
  const s=st(i), c=A(i).click;
  return itemCard('click', c.emoji, c.name+' <span style="font-weight:400;color:var(--ink-soft)">niv. '+s.clickLvl+'</span>', '+'+fmt(clickValue(i)*PREST()), c.desc, '', clickCost(i), s.cur, ()=>{ if(buyClick(i,buyMode)){renderShop();save();} });
}
function rowUpg(i,u){
  const s=st(i);
  if(u.once){ const owned=!!s.u[u.id]; const cost=upgCost(i,u); return itemCard('upg', u.emoji, u.name, owned?'✓':'', u.desc, '', owned?null:cost, s.cur, owned?null:()=>{ if(buyUpg(i,u,'1')){renderShop();save();} }, owned); }
  const L=s.u[u.id]||0;
  return itemCard('upg', u.emoji, u.name+' <span style="font-weight:400;color:var(--ink-soft)">niv. '+L+'</span>', '×'+(1+L*u.boost).toFixed(2), u.desc, '', upgCost(i,u), s.cur, ()=>{ if(buyUpg(i,u,buyMode)){renderShop();save();} });
}
function renderShop(){
  const i=view(), a=A(i);
  updateShopScore();
  shopList.innerHTML='';
  shopList.appendChild(isRevealed(i,a.click)?rowClick(i):lockedCard(a.click));
  a.tiers.forEach(t=> shopList.appendChild(isRevealed(i,t)?rowProducer(i,t):lockedCard(t)));
  a.upg.forEach(u=> shopList.appendChild(isRevealed(i,u)?rowUpg(i,u):lockedCard(u)));
  if(a.next && i===S.unlocked-1 && S.unlocked<3){
    const can=st(i).cur>=a.next.cost, div=document.createElement('div');
    div.className='item next '+(can?'affordable':'cant');
    div.innerHTML=`<div class="n-title">${a.next.title}</div><div class="n-flavor">${a.next.flavor}</div><div class="n-cost">${fmt(Math.ceil(a.next.cost))} ${a.cur.emoji}</div>`;
    if(can) div.onclick=investNext;
    shopList.appendChild(div);
  }
  updateBadge();
}

/* ---- RACCOURCIS + BADGE ---- */
function affordableList(){
  const i=view(),a=A(i),s=st(i),out=[];
  if(isRevealed(i,a.click) && clickCost(i)<=s.cur) out.push({emoji:a.click.emoji,name:a.click.name,cost:clickCost(i),fn:()=>buyClick(i,buyMode)});
  a.tiers.forEach(t=>{ if(isRevealed(i,t)&&tierCost(i,t)<=s.cur) out.push({emoji:t.emoji,name:t.name,cost:tierCost(i,t),fn:()=>buyTier(i,t,buyMode)}); });
  a.upg.forEach(u=>{ if(isRevealed(i,u)){ if(u.once&&s.u[u.id])return; const c=upgCost(i,u); if(c<=s.cur) out.push({emoji:u.emoji,name:u.name,cost:c,fn:()=>buyUpg(i,u,u.once?'1':buyMode)}); } });
  return out;
}
function nextAffordable(){ const a=A(view()); return a.next && view()===S.unlocked-1 && S.unlocked<3 && st(view()).cur>=a.next.cost; }
function updateBadge(){
  const badge=document.getElementById('shop-badge');
  if(shopEl.classList.contains('open')){ badge.classList.remove('on'); return; }
  const n=affordableList().length + (nextAffordable()?1:0);
  if(n>0){ badge.textContent=n; badge.classList.add('on'); } else badge.classList.remove('on');
}
function renderQuickBuy(){
  if(shopEl.classList.contains('open')||inFinale){ quickBuy.innerHTML=''; return; }
  const items=affordableList(); quickBuy.innerHTML='';
  items.slice(0,4).forEach(it=>{ const b=document.createElement('button'); b.className='qbtn'; b.innerHTML=`<span class="qn">${it.emoji} ${it.name}</span><span class="qc">${fmt(Math.ceil(it.cost))} ${A(view()).cur.emoji}</span>`; b.onclick=()=>{ it.fn(); renderShop(); save(); renderQuickBuy(); }; quickBuy.appendChild(b); });
  const a=A(view());
  if(nextAffordable()){ const b=document.createElement('button'); b.className='qbtn qall'; b.innerHTML=`<span class="qn">🚀 ${a.next.title}</span><span class="qc">${fmt(Math.ceil(a.next.cost))} ${a.cur.emoji}</span>`; b.onclick=()=>{ investNext(); renderQuickBuy(); }; quickBuy.appendChild(b); }
}

/* ---- BOUTIQUE UI ---- */
let buyMode='1';
function openShop(){ shopEl.classList.add('open'); document.body.classList.add('shop-open'); renderShop(); }
function closeShop(){ shopEl.classList.remove('open'); document.body.classList.remove('shop-open'); }
document.getElementById('shop-toggle').onclick=()=>{ shopEl.classList.contains('open')?closeShop():openShop(); };
document.getElementById('shop-close').onclick=closeShop;
document.getElementById('hud').onclick=openShop;
document.getElementById('buy-all').onclick=buyAll;
document.querySelectorAll('.buy-mode').forEach(btn=>{ btn.onclick=()=>{ document.querySelectorAll('.buy-mode').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); buyMode=btn.dataset.mode; renderShop(); }; });
document.getElementById('reset-btn').onclick=()=>{ if(confirm('Tout effacer, y compris tes IA de prestige ?')){ localStorage.removeItem(SAVE_KEY); S=freshState(0); setView(0); } };

/* ---- FINALE : 2 avertissements → Matrix → victoire → prestige ---- */
let inFinale=false;
const modal=document.getElementById('modal'), modalBox=document.getElementById('modal-box');
function showModal(html){ modalBox.innerHTML=html; modal.classList.add('on'); }
function hideModal(){ modal.classList.remove('on'); }
aiOffer.onclick=()=>{
  closeShop(); aiOffer.classList.remove('on');
  showModal(`<div class="m-emoji">🤖</div><h3>Laisse l'IA finir à ta place !</h3><p>Tu as bien mérité de te reposer. Appuie ici et le jeu <b>avancera tout seul</b> : l'IA optimise tout, achète tout, clique à ta place. Plus aucun effort. C'est génial, non ?</p><div class="m-btns"><button class="m-btn go" id="m-go1">Oui, laisse l'IA gérer&nbsp;!</button><button class="m-btn back" id="m-back1">Non, je continue à jouer</button></div>`);
  document.getElementById('m-back1').onclick=hideModal;
  document.getElementById('m-go1').onclick=()=>{
    showModal(`<div class="m-emoji">🫥</div><h3>Attends… t'as bien compris ?</h3><p>Si tu laisses l'IA jouer à ta place, <b>il n'y a plus de jeu</b>. Tu ne cliques plus, tu ne choisis plus, tu ne joues plus <em>rien</em>. Tu regardes juste une machine finir à ta place. C'est <b>ça</b> que tu veux vraiment ?</p><div class="m-btns"><button class="m-btn go" id="m-go2">Oui, je clique quand même</button><button class="m-btn back" id="m-back2">Ah non, en fait je joue</button></div>`);
    document.getElementById('m-back2').onclick=hideModal;
    document.getElementById('m-go2').onclick=startMatrix;
  };
};
function startMatrix(){
  hideModal(); inFinale=true; closeShop(); aiOffer.classList.remove('on'); quickBuy.innerHTML='';
  const wrap=document.getElementById('matrix'); wrap.classList.add('on');
  const cv=document.getElementById('matrix-canvas'), c=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const drops=Array(Math.floor(cv.width/16)).fill(1);
  const chars='アイウエオカキクケコ0123456789ABCDEF{}[]<>/;=+*01';
  const iv=setInterval(()=>{
    c.fillStyle='rgba(0,0,0,.08)'; c.fillRect(0,0,cv.width,cv.height);
    c.fillStyle='#7ee787'; c.font='15px monospace';
    for(let x=0;x<drops.length;x++){ const ch=chars[Math.floor(Math.random()*chars.length)]; c.fillText(ch,x*16,drops[x]*16); if(drops[x]*16>cv.height && Math.random()>0.975) drops[x]=0; drops[x]++; }
  },33);
  setTimeout(()=>{ clearInterval(iv); wrap.classList.remove('on'); showWin(); }, 4000);
}
function showWin(){
  document.getElementById('win').classList.add('on');
  document.getElementById('win-ia').innerHTML = `Vous recevez une <b>IA</b>.<br>Votre prochaine partie : production <b>×${fmt(Math.pow(100,S.ia+1))}</b> partout.`;
}
document.getElementById('win-restart').onclick=()=>{
  const keep=S.ia+1;
  localStorage.removeItem(SAVE_KEY);
  S=freshState(keep);
  document.getElementById('win').classList.remove('on');
  inFinale=false; save(); setView(0);
};

/* ---- PROGRESSION HORS-LIGNE ---- */
(function offline(){
  const dt=Math.min((Date.now()-(S.lastTs||Date.now()))/1000, 8*3600); if(dt<=5) return;
  const before=S.acts.reduce((t,s)=>t+s.earned,0);
  const steps=Math.min(600,Math.max(1,Math.round(dt))), sdt=dt/steps;
  for(let k=0;k<steps;k++) tick(sdt);
  const gained=S.acts.reduce((t,s)=>t+s.earned,0)-before;
  if(gained>0) setTimeout(()=>showMilestone('💤','De retour ! Tes arcs ont tourné pendant ton absence.'),500);
})();

/* ---- BOUCLE ---- */
setView(S.view<S.unlocked?S.view:0);
let last=performance.now(), acc=0, shopAcc=0, badgeAcc=0;
function loop(now){
  const dt=Math.min((now-last)/1000,0.25); last=now;
  tick(dt); updateHUD();
  if(shopEl.classList.contains('open')){ updateShopScore(); shopAcc+=dt; if(shopAcc>=0.4){ shopAcc=0; renderShop(); } }
  badgeAcc+=dt; if(badgeAcc>=0.3){ badgeAcc=0; updateBadge(); renderQuickBuy(); }
  acc+=dt; if(acc>=5){ acc=0; save(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---- SPAWN continu ---- */
(function schedule(){ spawnFloater(); setTimeout(schedule, rand(1400,2600)); })();
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) save(); });
</script>

document.addEventListener('touchmove',function(e){ if(e.touches.length>1) e.preventDefault(); },{passive:false});
