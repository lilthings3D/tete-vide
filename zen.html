<div class="foot">Suis le bouddha : il gonfle, tu inspires — il se dégonfle, tu expires. C'est tout.</div>

<script>
(function(){
  const breather=document.getElementById("breather");
  const word=document.getElementById("cue-word"), sub=document.getElementById("cue-sub");
  const CYCLE=12; // secondes : inspire 4 · retiens 2 · expire 6
  const MIN=0.82, MAX=1.10;
  const ease=p=>p*p*(3-2*p);
  const lerp=(a,b,p)=>a+(b-a)*p;
  let start=null, curWord="";
  function set(w,s){ if(w!==curWord){ curWord=w; word.textContent=w; if(s!==undefined) sub.textContent=s; } }
  function frame(ts){
    if(start===null) start=ts;
    const t=((ts-start)/1000)%CYCLE;
    let scale, w, s;
    if(t<4){ scale=lerp(MIN,MAX,ease(t/4)); w="Inspire…"; s="par le nez, doucement"; }
    else if(t<6){ scale=MAX; w="Retiens"; s="juste un instant"; }
    else { scale=lerp(MAX,MIN,ease((t-6)/6)); w="Expire…"; s="relâche tout"; }
    breather.style.transform="scale("+scale.toFixed(3)+")";
    set(w,s);
    requestAnimationFrame(frame);
  }
  // petit délai avant de démarrer, le temps de s'installer
  setTimeout(()=>{ requestAnimationFrame(frame); }, 1600);
})();
</script>
